name: delivery tests

# Scoped to plugins/delivery/** (plus this file) so a PR touching only the
# other plugin doesn't need this workflow to run at all -- each plugin's CI
# is independently green or red, easier to diagnose and fix.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/delivery/**'
      - '.github/workflows/delivery-tests.yml'
  pull_request:
    paths:
      - 'plugins/delivery/**'
      - '.github/workflows/delivery-tests.yml'

jobs:
  test:
    name: node --test (plugins/delivery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No package.json, no dependencies -- every test uses only Node
      # builtins. The glob is quoted so node expands it (** included); the
      # tests put the fake bd in scripts/testing/ on PATH, never the real one.
      # hooks/scripts/*.test.js includes record-invocation.test.js.
      - name: Run test suite
        run: node --test 'plugins/delivery/scripts/**/*.test.js' plugins/delivery/hooks/scripts/*.test.js
